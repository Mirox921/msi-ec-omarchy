name: Validate compatibility package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and hardware guards
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh
          python3 -m unittest discover -s tests -v
          git diff --check
  ubuntu-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic
      - name: Build against packaged Ubuntu headers
        run: |
          target=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$target"
          make KDIR="$target"
  arch-build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git linux-headers
      - uses: actions/checkout@v4
      - name: Build against packaged Arch headers
        run: |
          target=$(find /usr/lib/modules -mindepth 2 -maxdepth 2 -name build | sort -V | tail -n 1)
          test -n "$target"
          make KDIR="$target"
