name: Driver compatibility problem
description: Report a build, installation or supported-hardware problem.
body:
  - type: markdown
    attributes:
      value: Do not include serial numbers, account keys, private files, complete EC dumps or raw-register write instructions.
  - type: input
    id: model
    attributes:
      label: Laptop model
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: BIOS and EC firmware versions (both)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Distribution, kernel, and DKMS package version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant build error or read-only check output (redact personal paths)
      render: text
